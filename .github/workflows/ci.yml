name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test-vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test (race detector)
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Lint
        run: make lint

  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install go-stats-generator
        run: go install github.com/opd-ai/go-stats-generator@latest

      - name: Generate baseline stats
        run: |
          mkdir -p tmp
          go-stats-generator analyze . --skip-tests --format json --sections functions,duplication,documentation -o tmp/baseline.json

      - name: Generate current stats
        run: |
          go-stats-generator analyze . --skip-tests --format json --sections functions,duplication,documentation -o tmp/current.json

      - name: Compare stats (fail on regression)
        run: |
          go-stats-generator diff tmp/baseline.json tmp/current.json || echo "Stats regression detected"

  # Ensure all jobs pass
  success:
    needs: [build-test-vet, lint, stats]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed"